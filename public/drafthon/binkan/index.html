<meta name="description" content="동성로 빈 점포에 「여기 ○○ 있으면」을 남기면, 준비된 사장님이 가게를 열고 대구 대학생 팀이 개업 준비를 돕습니다.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="같이가게">
<meta property="og:title" content="같이가게 — 의견에서 개업, 운영까지">
<meta property="og:description" content="동성로 빈 점포에 「여기 ○○ 있으면」을 남기면, 준비된 사장님이 가게를 열고 대구 대학생 팀이 개업 준비를 도와요.">
<meta property="og:image" content="https://parkmiyeong.com/drafthon/binkan/og/home.png">

<body>
<header class="top">
  <a class="logo" href="#" data-act="home"><span class="mark">빈칸</span><span class="name">같이가게</span></a>
  <form class="search" id="search" role="search">
    <input id="q" type="search" placeholder="가게 · 업종 · 거리 찾기 (예: 파스타)" autocomplete="off" aria-label="검색">
    <button type="submit">찾기</button>
  </form>
  <div class="me" id="me"></div>
</header>

<main class="body">
  <nav class="rail" aria-label="입구">
    <p class="railh">이런 분이라면</p>
    <button class="door" data-act="owner"><b>사장님이세요?</b><small>창업 · 경영 상담과 받을 수 있는 지원</small></button>
    <button class="door" data-act="student"><b>대학생이세요?</b><small>동행 프로젝트 · 장학금 · 학점 · 경력</small></button>
    <button class="door minor" data-act="howto"><b>이용 방법</b><small>빈칸 · 의견 · 공감이 뭔가요</small></button>
    <div class="railbox" id="railBox"></div>
  </nav>

  <section class="mapwrap">
    <div id="map" class="map" aria-label="동성로 지도"></div>
    <div class="legend"><span><i class="lg sp"></i>빈칸(공실 후보)</span><span><i class="lg wi"></i>의견이 붙은 빈칸</span></div>
    <div id="mapmsg" class="mapmsg" hidden></div>
  </section>

  <aside class="panel" id="panel" aria-live="polite"></aside>
  <section class="work" id="work" aria-live="polite"></section>
</main>

<footer class="event" id="event">
  <span class="eb">오픈 이벤트</span>
  <span class="et">동성로 빈칸에 원하는 가게를 말해 주세요 — 공감을 많이 받은 의견에 커피 · 배달 상품권(시범 운영 시작 때 열려요)</span>
  <button data-act="join">참여하기</button>
</footer>

<div class="modal" id="modal" hidden><div class="box" role="dialog" aria-modal="true" id="modalBox"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="data/spaces.js"></script>
<script src="data/seed.js"></script>
<script src="data/support.js"></script>
<script src="map.js"></script>
<script src="backend.js"></script>
<script src="app.js"></script>
<script src="owner.js"></script>
<script src="mystore.js"></script>
<script src="ops.js"></script>
<script src="student.js"></script>
<script src="assist.js"></script>
<script src="chat.js"></script>
</body>
</html>
